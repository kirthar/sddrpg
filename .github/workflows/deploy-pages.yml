# Deploys the Compose demo app's web (wasmJs) build to GitHub Pages (spec 009 US3).
#
# One-time setup by the repository owner: Settings -> Pages -> Source = "GitHub Actions".
# Runs on pushes to the default branch (or manually via "Run workflow").
name: Deploy demo-app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build wasmJs production distribution
        run: ./gradlew :demo-app:wasmJsBrowserDistribution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-app/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
