org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# Use npm instead of yarn for Kotlin/JS (yarn dist download is blocked in some CI/sandbox proxies)
kotlin.js.yarn=false
# AndroidX is the only Android artifact universe this project uses (demo-app module)
android.useAndroidX=true
